spring.application.name=fitlab

# Railway entrega el puerto en la variable PORT; en local usamos 8080.
server.port=${PORT:8080}

# La URL de Atlas se lee desde una variable de entorno para no subir la contraseña a GitHub.
spring.mongodb.uri=${MONGODB_URI}
# Muestra el mensaje de error (por ejemplo "El precio debe ser mayor a 0.") en la respuesta.
spring.web.error.include-message=always
